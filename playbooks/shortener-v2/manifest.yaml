# Change catalogue for "make links safer, faster, with marketing analytics" (ambiguous scenario).
# Which tasks run depends on the answers to the clarifying questions. Edits to shared files
# (ShortenerProperties, LinkService) anchor on lines no other task changes, so any subset of
# these tasks applies cleanly in plan order.
name: shortener-v2
package: com.example.shortener
coverage_min: 90
docs:
  app: shortener
serve_props: {spring.datasource.url: "jdbc:h2:file:{run_dir}/service/shortener", shortener.api-keys: dev-key}
smoke_props: {shortener.api-keys: smoke-key}
smoke:
  - {method: GET, path: /readyz, expect: 200}
  - {method: POST, path: /api/v1/links, json: {url: "https://example.com/smoke"}, headers: {X-API-Key: smoke-key}, expect: 201, save: code}
  - {method: GET, path: "/{code}", expect: 302}
  - {method: GET, path: "/api/v1/links/{code}/stats", headers: {X-API-Key: smoke-key}, expect: 200}
tasks:
  - id: perf.redirect_cache
    title: "Q-PERF: bounded TTL read-through cache on the redirect path (p95 < 50 ms)"
    capabilities: [redirect_cache]
    writes: [src/main/java/com/example/shortener/service/TtlCache.java,
             src/main/java/com/example/shortener/config/ShortenerProperties.java,
             src/main/java/com/example/shortener/service/LinkService.java,
             src/test/java/com/example/shortener/unit/TtlCacheTest.java,
             src/test/java/com/example/shortener/integration/RedirectPerformanceTest.java]
    verify: [src/test/java/com/example/shortener/unit/TtlCacheTest.java,
             src/test/java/com/example/shortener/integration/RedirectPerformanceTest.java]
    ops:
      - {op: write, path: src/main/java/com/example/shortener/service/TtlCache.java, src: files/src/main/java/com/example/shortener/service/TtlCache.java}
      - {op: write, path: src/test/java/com/example/shortener/unit/TtlCacheTest.java, src: files/src/test/java/com/example/shortener/unit/TtlCacheTest.java}
      - {op: write, path: src/test/java/com/example/shortener/integration/RedirectPerformanceTest.java, src: files/src/test/java/com/example/shortener/integration/RedirectPerformanceTest.java}
      - op: edit
        path: src/main/java/com/example/shortener/config/ShortenerProperties.java
        old: |2
                  @DefaultValue("false") boolean allowPrivateTargets,
        new: |2
                  @DefaultValue("false") boolean allowPrivateTargets,
                  @DefaultValue("10000") int redirectCacheSize,
                  @DefaultValue("30") int redirectCacheTtlSeconds,
      - op: edit
        path: src/main/java/com/example/shortener/service/LinkService.java
        old: |2
              private final Clock clock;
        new: |2
              private final Clock clock;
              private final TtlCache<Link> cache;
      - op: edit
        path: src/main/java/com/example/shortener/service/LinkService.java
        old: |2
                  this.clock = clock;
        new: |2
                  this.clock = clock;
                  // Bounded staleness across instances: entries live at most redirectCacheTtlSeconds.
                  this.cache = new TtlCache<>(props.redirectCacheSize(),
                          Duration.ofSeconds(props.redirectCacheTtlSeconds()), clock);
      - op: edit
        path: src/main/java/com/example/shortener/service/LinkService.java
        old: |2
              public Link resolve(String code) {
                  Link link = repo.find(code).orElseThrow(() -> new Errors.NotFound(code));
        new: |2
              public Link resolve(String code) {
                  Link link = cache.get(code).orElse(null);
                  if (link == null) {
                      // Misses are not cached, so a newly created alias works at once.
                      link = repo.find(code).orElseThrow(() -> new Errors.NotFound(code));
                      cache.put(code, link);
                  }
                  // Expiry and deletion are still checked on every hit, cached or not.
      - op: edit
        path: src/main/java/com/example/shortener/service/LinkService.java
        old: |2
                  repo.softDelete(code, clock.instant());
        new: |2
                  repo.softDelete(code, clock.instant());
                  cache.invalidate(code);

