spring.application.name=shortener
spring.datasource.url=jdbc:h2:file:./data/shortener;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
server.port=8000
springdoc.api-docs.path=/v3/api-docs

# Management API fails closed: with no keys configured every call is 401.
shortener.base-url=http://localhost:8000
shortener.api-keys=
shortener.code-length=7
shortener.max-url-length=2048
shortener.rate-limit-per-minute=60
shortener.allow-private-targets=false
shortener.async-clicks=true
spring.jackson.deserialization.fail-on-unknown-properties=true
